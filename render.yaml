databases:
  - name: skillconnect-hub-db
    databaseName: skillconnect_hub
    user: skillconnect
    plan: free

services:
  - type: web
    name: skillconnect-hub-api
    runtime: node
    buildCommand: npm install && npm install --prefix web && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillconnect-hub-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PG_POOL_MAX
        value: "10"
      - key: PG_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: PG_QUERY_TIMEOUT_MS
        value: "10000"
      - key: CLIENT_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: SkillConnect-HUB
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_FEE_PERCENT
        value: "10"
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: DISPUTE_MONTHLY_LIMIT
        value: "2"
      - key: APPEAL_DAYS
        value: "7"
      - key: AUTO_RELEASE_HOURS
        value: "48"
      - key: NEW_CUSTOMER_MAX_ORDER_AMOUNT
        value: "100000"
      - key: NEW_CUSTOMER_MAX_OPEN_ORDERS
        value: "2"
      - key: RAISED_CUSTOMER_MAX_OPEN_ORDERS
        value: "10"
      - key: TWO_STRIKE_MAX_ORDER_AMOUNT
        value: "50000"
      - key: COMPLETED_ORDERS_TO_RAISE_LIMIT
        value: "3"
      - key: RAISED_CUSTOMER_MAX_ORDER_AMOUNT
        value: "1000000"
      - key: PHONE_VERIFICATION_MODE
        value: "production"
      - key: PHONE_VERIFICATION_CODE_TTL_MINUTES
        value: "10"
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        value: SkillConnect
      - key: TERMII_BASE_URL
        value: https://api.ng.termii.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VERIFICATION_ENCRYPTION_KEY
        sync: false
